name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in CalVer format (e.g., 2.2025.1.15)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  create-release:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
      with:
        nuget-version: 'latest'
    
    - name: Validate version format
      run: |
        $version = "${{ github.event.inputs.version }}"
        # CalVer format: MAJOR.YYYY.M.D (e.g., 1.2022.10.3 or 2.2025.1.15)
        if ($version -notmatch '^\d+\.\d{4}\.\d{1,2}\.\d{1,2}$') {
          Write-Error "Invalid version format. Use CalVer format: MAJOR.YYYY.M.D (e.g., 2.2025.1.15)"
          exit 1
        }
        Write-Host "Version $version is valid (CalVer format)"
    
    - name: Check if tag exists
      run: |
        $version = "${{ github.event.inputs.version }}"
        $tag = "v$version"
        
        git fetch --tags
        if (git tag -l $tag) {
          Write-Error "Tag $tag already exists!"
          exit 1
        }
        Write-Host "Tag $tag is available"
    
    - name: Update version in AssemblyInfo
      run: |
        $version = "${{ github.event.inputs.version }}"
        $assemblyInfo = "Innofactor.Xrm.Persistent.Collections\Properties\AssemblyInfo.cs"

        # CalVer format already has 4 parts (MAJOR.YYYY.M.D)
        # AssemblyVersion needs exactly 4 parts, so use as-is
        $content = Get-Content $assemblyInfo -Raw
        $content = $content -replace 'AssemblyVersion\("[\d.]+"\)', "AssemblyVersion(`"$version`")"
        $content = $content -replace 'AssemblyFileVersion\("[\d.]+"\)', "AssemblyFileVersion(`"$version`")"
        Set-Content $assemblyInfo $content

        Write-Host "Updated AssemblyInfo to CalVer version $version"
    
    - name: Restore NuGet packages
      run: nuget restore Xrm.Persistent.Collections.sln
    
    - name: Build Release
      run: msbuild Xrm.Persistent.Collections.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
    
    - name: Run tests
      run: |
        dotnet test "Innofactor.Xrm.Persistent.Collections.Tests\Xrm.Persistent.Collections.Tests.csproj" `
          --configuration Release `
          --no-build `
          --verbosity normal
    
    - name: Pack NuGet package
      run: |
        $version = "${{ github.event.inputs.version }}"
        
        # Update nuspec version
        $nuspecPath = "Xrm.Persistent.Collections.nuspec"
        $content = Get-Content $nuspecPath -Raw
        $content = $content -replace '<version>.*</version>', "<version>$version</version>"
        Set-Content $nuspecPath $content
        
        # Pack
        nuget pack $nuspecPath -OutputDirectory .\artifacts -Properties Configuration=Release
        
        Write-Host "NuGet package created"
    
    - name: Extract release notes
      id: changelog
      run: |
        $version = "${{ github.event.inputs.version }}"
        $changelog = Get-Content CHANGELOG.md -Raw
        
        # Extract section for this version
        if ($changelog -match "(?s)## \[$version\].*?(?=## \[|\z)") {
          $notes = $matches[0]
        } else {
          $notes = "Release version $version`n`nSee CHANGELOG.md for details."
        }
        
        # Save to file for GitHub release
        Set-Content -Path release-notes.md -Value $notes
        
        Write-Host "Extracted release notes for v$version"
    
    - name: Create Git tag
      run: |
        $version = "${{ github.event.inputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v$version" -m "Release v$version"
        git push origin "v$version"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        files: |
          artifacts/*.nupkg
          CHANGELOG.md
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to NuGet.org
      if: github.event.inputs.prerelease == 'false'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $nupkg = Get-ChildItem .\artifacts\*.nupkg | Select-Object -First 1
        if ($env:NUGET_API_KEY) {
          nuget push $nupkg.FullName -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json
          Write-Host "Published to NuGet.org"
        } else {
          Write-Warning "NUGET_API_KEY secret not set. Skipping NuGet publish."
          Write-Host "To publish manually:"
          Write-Host "  nuget push $($nupkg.Name) -ApiKey YOUR_KEY -Source https://api.nuget.org/v3/index.json"
        }
